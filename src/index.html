<!DOCTYPE html>
<html>
<!--
  Clock-Clock Main Application
  Version: 2026.09.21.17.25.00
  Description: 15x8 Clock-Clock matrix visualizer with configurable patterns via .env, 
               Adobe Kuler color palettes, seeded PRNG, and e-ink color reversal mode.
-->
<head>
  <title>Clock Clock</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #clock-grid {
      display: grid;
      grid-template-columns: repeat(15, 60px);
      grid-template-rows: repeat(8, 60px);
      gap: 5px;
    }
  </style>
</head>
<body>
  <div id="clock-grid"></div>

  <script type="module">
    /**
     * Clock-Clock Controller
     * Version: 2026.09.21.17.25.00
     */

    import { ClockGrid } from './clock-grid.js';
    import digitPatterns from './digits.json' assert { type: 'json' };
    import { TimeDisplay } from './time-display.js';
    import patterns from './patterns.json' assert { type: 'json' };
    import transitions from './transitions.json' assert { type: 'json' };

    // =========================================================================
    // Configurable Parameters & Defaults (Reference comments provided)
    // =========================================================================
    const DEFAULT_REVERSE_COLORS = false; // Default: false (true for black on white e-ink mode)
    const DEFAULT_PALETTE_INDEX = 0;     // Default: 0 (Palette 0: Classic Monochrome)
    const DEFAULT_RANDOM_SEED = 12345;   // Default: 12345 (Deterministic seed for random transitions)
    const DEFAULT_TRANSITION_DELAY_SEC = 2; // Default: 2 seconds
    const DEFAULT_DISPLAY_DURATION_SEC = 8; // Default: 8 seconds

    // 5 Adobe Kuler Color Palettes [background, gridBackground, clockFace, clockBorder, clockHand, shadow]
    // Palette 0: "Classic Monochrome" (Deep Black & Pure White)
    // Palette 1: "Adobe Kuler - Flat Design Slate" (Cool minimalist slates and blues)
    // Palette 2: "Adobe Kuler - Retro Metro Warm" (Warm retro aesthetic)
    // Palette 3: "Adobe Kuler - Techno Slate" (High-tech contrast)
    // Palette 4: "Adobe Kuler - Paper & Charcoal Minimalist" (Clean paper and charcoal tones)
    const COLOR_PALETTES = [
      {
        name: "Classic Monochrome",
        normal: {
          bg: "#111111",
          gridBg: "#111111",
          face: "#181818",
          border: "#282828",
          hand: "#ffffff",
          shadow: "rgba(0,0,0,0.5)"
        },
        reverse: {
          bg: "#ffffff",
          gridBg: "#ffffff",
          face: "#f4f4f4",
          border: "#d0d0d0",
          hand: "#000000",
          shadow: "rgba(0,0,0,0.1)"
        }
      },
      {
        name: "Adobe Kuler - Flat Design Slate",
        normal: {
          bg: "#1e2b37",
          gridBg: "#17202a",
          face: "#2c3e50",
          border: "#34495e",
          hand: "#ecf0f1",
          shadow: "rgba(0,0,0,0.5)"
        },
        reverse: {
          bg: "#ecf0f1",
          gridBg: "#f7f9fa",
          face: "#ffffff",
          border: "#bdc3c7",
          hand: "#2c3e50",
          shadow: "rgba(0,0,0,0.1)"
        }
      },
      {
        name: "Adobe Kuler - Retro Metro Warm",
        normal: {
          bg: "#241e1e",
          gridBg: "#1b1616",
          face: "#3a2f2f",
          border: "#594747",
          hand: "#f3e9d2",
          shadow: "rgba(0,0,0,0.5)"
        },
        reverse: {
          bg: "#f3e9d2",
          gridBg: "#faf6ee",
          face: "#ffffff",
          border: "#d4c5a9",
          hand: "#3a2f2f",
          shadow: "rgba(0,0,0,0.1)"
        }
      },
      {
        name: "Adobe Kuler - Techno Slate",
        normal: {
          bg: "#0f141d",
          gridBg: "#090d13",
          face: "#1a2332",
          border: "#27374d",
          hand: "#9db2bf",
          shadow: "rgba(0,0,0,0.5)"
        },
        reverse: {
          bg: "#dde6ed",
          gridBg: "#edf2f7",
          face: "#f0f4f8",
          border: "#9db2bf",
          hand: "#27374d",
          shadow: "rgba(0,0,0,0.1)"
        }
      },
      {
        name: "Adobe Kuler - Paper & Charcoal Minimalist",
        normal: {
          bg: "#1c1d21",
          gridBg: "#121316",
          face: "#2b2d42",
          border: "#404361",
          hand: "#edf2f4",
          shadow: "rgba(0,0,0,0.5)"
        },
        reverse: {
          bg: "#faf9f6",
          gridBg: "#f4f1ea",
          face: "#ffffff",
          border: "#dcd7d0",
          hand: "#1a1a1a",
          shadow: "rgba(0,0,0,0.1)"
        }
      }
    ];

    // =========================================================================
    // Read Environment Configuration (.env)
    // =========================================================================
    const envReverse = import.meta.env.VITE_REVERSE_COLORS;
    const isReverseColors = envReverse !== undefined 
      ? (String(envReverse).toLowerCase() === 'true' || String(envReverse) === '1')
      : DEFAULT_REVERSE_COLORS;

    const envPaletteIndex = parseInt(import.meta.env.VITE_PALETTE_INDEX, 10);
    const activePaletteIndex = (!isNaN(envPaletteIndex) && envPaletteIndex >= 0 && envPaletteIndex < COLOR_PALETTES.length)
      ? envPaletteIndex
      : DEFAULT_PALETTE_INDEX;

    const envRandomSeed = parseInt(import.meta.env.VITE_RANDOM_SEED, 10);
    const activeSeed = !isNaN(envRandomSeed) ? envRandomSeed : DEFAULT_RANDOM_SEED;

    // Apply active color palette and reverse (e-ink) mode to CSS custom properties
    const activePalette = COLOR_PALETTES[activePaletteIndex];
    const themeColors = isReverseColors ? activePalette.reverse : activePalette.normal;

    document.documentElement.style.setProperty('--bg-color', themeColors.bg);
    document.documentElement.style.setProperty('--grid-bg-color', themeColors.gridBg);
    document.documentElement.style.setProperty('--clock-face-color', themeColors.face);
    document.documentElement.style.setProperty('--clock-border-color', themeColors.border);
    document.documentElement.style.setProperty('--clock-hand-color', themeColors.hand);
    document.documentElement.style.setProperty('--container-shadow', themeColors.shadow);

    // =========================================================================
    // Seeded PRNG (Mulberry32) for deterministic random transitions
    // =========================================================================
    let prngState = activeSeed;
    function seededRandom() {
      let t = (prngState += 0x6D2B79F5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    // =========================================================================
    // Pattern Filtering via .env flags
    // =========================================================================
    const PATTERN_ENV_KEY_MAP = {
      'Current Time': 'VITE_PATTERN_CURRENT_TIME',
      'Snake': 'VITE_PATTERN_SNAKE',
      'Squares': 'VITE_PATTERN_SQUARES',
      'Waves': 'VITE_PATTERN_WAVES',
      'X Cross': 'VITE_PATTERN_X_CROSS',
      'Columns': 'VITE_PATTERN_COLUMNS',
      'Chaos 1': 'VITE_PATTERN_CHAOS_1',
      'Vertical Weave': 'VITE_PATTERN_VERTICAL_WEAVE',
      'Diagonal Weave': 'VITE_PATTERN_DIAGONAL_WEAVE',
      'Chaos 2': 'VITE_PATTERN_CHAOS_2',
      'All Vertical': 'VITE_PATTERN_ALL_VERTICAL',
      'All Horizontal': 'VITE_PATTERN_ALL_HORIZONTAL',
      'Somersaults': 'VITE_PATTERN_SOMERSAULTS',
      'Smilies': 'VITE_PATTERN_SMILIES'
    };

    function isPatternEnabled(patternName) {
      const envKey = PATTERN_ENV_KEY_MAP[patternName];
      if (!envKey) return true; // Default to true if unmapped
      const val = import.meta.env[envKey];
      if (val === undefined || val === null || val === '') return true; // Default true
      return String(val).toLowerCase() === 'true' || String(val) === '1';
    }

    // Filter enabled patterns
    const enabledPatterns = patterns.filter(p => isPatternEnabled(p.name));
    const enabledPatternNames = new Set(enabledPatterns.map(p => p.name));
    const isCurrentTimeEnabled = isPatternEnabled('Current Time');

    console.log(`[Theme] Palette: ${activePalette.name} (Index ${activePaletteIndex}), Reverse/E-Ink: ${isReverseColors}, Seed: ${activeSeed}`);
    console.log(`[Patterns] ${enabledPatterns.length} of ${patterns.length} patterns enabled:`, enabledPatterns.map(p => p.name));

    const container = document.getElementById('clock-grid');
    // Initialize TimeDisplay with both digit patterns and clock patterns
    const timeDisplay = new TimeDisplay(digitPatterns, patterns);
    const currentTimePattern = patterns.find(p => p.name === 'Current Time');

    // Update function preserving borders
    const updateCurrentTimeDisplay = () => {
      return timeDisplay.getBorderedTimeGrid();
    };

    // Initialize with Current Time pattern or first enabled pattern
    const initialGrid = isCurrentTimeEnabled 
      ? timeDisplay.getBorderedTimeGrid()
      : (enabledPatterns[0]?.grid || timeDisplay.getBorderedTimeGrid());

    container.clockGrid = new ClockGrid(container, initialGrid);

    // Set up animation cycle
    let currentIndex = 0;
    
    function runNextTransition() {
      if (enabledPatterns.length === 0 && !isCurrentTimeEnabled) {
        console.warn('No patterns enabled in .env.');
        return;
      }

      const rawTransitions = transitions.transitions || [];
      const transition = rawTransitions.length > 0 
        ? rawTransitions[currentIndex % rawTransitions.length]
        : { pattern: 'random', duration: DEFAULT_DISPLAY_DURATION_SEC };
      
      // Handle pattern selection respecting enabled patterns
      let targetPattern = transition.pattern;
      
      if (targetPattern === 'random') {
        const eligiblePatterns = enabledPatterns.filter(p => p.name !== 'Current Time');
        if (eligiblePatterns.length > 0) {
          const randomIndex = Math.floor(seededRandom() * eligiblePatterns.length);
          targetPattern = eligiblePatterns[randomIndex].name;
        } else if (isCurrentTimeEnabled) {
          targetPattern = 'Current Time';
        } else if (enabledPatterns.length > 0) {
          targetPattern = enabledPatterns[0].name;
        }
      } else if (!enabledPatternNames.has(targetPattern)) {
        // If specified pattern is disabled in .env, pick an enabled replacement
        if (targetPattern === 'Current Time' && !isCurrentTimeEnabled) {
          targetPattern = enabledPatterns[0]?.name;
        } else if (enabledPatterns.length > 0) {
          const randomIndex = Math.floor(seededRandom() * enabledPatterns.length);
          targetPattern = enabledPatterns[randomIndex].name;
        }
      }
      
      const pattern = patterns.find(p => p.name === targetPattern);
      
      if (pattern && isPatternEnabled(pattern.name)) {
        const targetGrid = targetPattern === 'Current Time' 
          ? timeDisplay.getBorderedTimeGrid() 
          : pattern.grid;
        
        const duration = (transition.duration || DEFAULT_DISPLAY_DURATION_SEC) * 1000;
        const delay = (transitions.transitionDelay || DEFAULT_TRANSITION_DELAY_SEC) * 1000;

        container.clockGrid.animateGrid(
          container.clockGrid.currentGrid,
          targetGrid, 
          duration,
          () => {
            currentIndex++;
            setTimeout(runNextTransition, delay);
          }
        );
      } else {
        console.log('Skipping disabled or missing pattern:', targetPattern);
        currentIndex++;
        setTimeout(runNextTransition, 500);
      }
    }
    
    // Start the transition cycle after initial display
    const initialDelay = (transitions.initialDisplayDuration ?? 0) * 1000;
    setTimeout(runNextTransition, initialDelay);
    
    // Debug logging
    console.log('Initialized with patterns:', enabledPatterns);
    console.log('Available transitions:', transitions);
  </script>
</body>
</html>
